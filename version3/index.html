<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Dashboard 2026 V3 - Phân tích Chiến lược Mới</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="data-v3.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #f8fafc;
      --foreground: #0f172a;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --secondary: #64748b;
      --accent: #f59e0b;
      --radius: 1rem;
    }
    body { font-family: 'Outfit', sans-serif; background-color: var(--background); color: var(--foreground); }
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
    .card { background-color: var(--card); border: 1px solid #e2e8f0; border-radius: var(--radius); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); border-color: #cbd5e1; }
    .sidebar-item-active { background: linear-gradient(to right, #1e293b, #334155); color: white; font-weight: 600; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    .nav-btn { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.875rem; transition: all 0.2s; }
    .nav-btn:hover:not(.sidebar-item-active) { background-color: #f1f5f9; color: #0f172a; }
    
    .mermaid { width: 100% !important; display: flex; justify-content: center; overflow: hidden; opacity: 0.9; }
    .chart-container { position: relative; height: 300px; width: 100%; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
  </style>
</head>
<body class="flex h-screen overflow-hidden">
  <script>
    (function() {
      const PASS = '@SeoTaza*2026';
      if (sessionStorage.getItem('seo_auth_v3') === 'true') return;
      document.body.style.overflow = 'hidden';
      const overlay = document.createElement('div');
      overlay.style = "position:fixed;top:0;left:0;width:100%;height:100%;backdrop-filter:blur(15px);background:rgba(15, 23, 42, 0.6);display:flex;align-items:center;justify-content:center;z-index:9999;";
      overlay.innerHTML = `
        <div class="bg-white p-10 max-w-sm w-full rounded-2xl shadow-2xl space-y-6 animate-fade-in">
          <div class="space-y-2 text-center">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black mb-4 shadow-lg ring-4 ring-blue-50">V3</div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">SEO Dashboard 2026</h1>
            <p class="text-sm text-slate-500 font-medium">Phiên bản cập nhật Kế hoạch Mới nhất</p>
          </div>
          <div class="space-y-4">
            <input type="password" id="p-v3" placeholder="Mật khẩu hệ thống" class="w-full border-2 border-slate-100 p-3 rounded-xl text-center outline-none focus:border-blue-500 transition-all font-semibold">
            <button id="s-v3" class="w-full bg-slate-900 text-white p-3 rounded-xl font-bold hover:bg-black transition-all shadow-lg">TRUY CẬP</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const login = () => { if(document.getElementById('p-v3').value === PASS) { sessionStorage.setItem('seo_auth_v3', 'true'); overlay.remove(); document.body.style.overflow = ''; initDashboard(); } };
      document.getElementById('s-v3').onclick = login;
      document.getElementById('p-v3').onkeypress = (e) => { if(e.key === 'Enter') login(); };
    })();
  </script>

  <!-- Sidebar -->
  <aside class="w-72 border-r border-slate-200 bg-white flex flex-col z-20 shadow-xl">
    <div class="p-8">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center text-white text-[12px] font-black shadow-lg">V3</div>
        <div>
           <span class="font-black text-slate-900 text-lg tracking-tighter leading-none block">TAZA GROUP</span>
           <span class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mt-0.5 block">SEO STRATEGY 2026</span>
        </div>
      </div>
    </div>
    
    <div class="flex-1 overflow-y-auto px-4 space-y-8">
      <div>
        <p class="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Tổng quan</p>
        <div class="space-y-1">
          <button onclick="switchTab('overview')" id="nav-overview" class="w-full nav-btn sidebar-item-active">
            <i data-lucide="layout-grid" class="w-5 h-5"></i> Dashboard chính
          </button>
          <button onclick="switchTab('roadmap')" id="nav-roadmap" class="w-full nav-btn text-slate-600">
            <i data-lucide="map" class="w-5 h-5"></i> Lộ trình chiến lược
          </button>
        </div>
      </div>

      <div>
        <p class="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Thương hiệu tập trung</p>
        <div class="space-y-1">
          <button onclick="switchTab('timona')" id="nav-timona" class="w-full nav-btn text-slate-600">
            <i data-lucide="graduation-cap" class="w-5 h-5"></i> Timona Academy
          </button>
          <button onclick="switchTab('clinic')" id="nav-clinic" class="w-full nav-btn text-slate-600">
            <i data-lucide="stethoscope" class="w-5 h-5"></i> Taza Skin Clinic
          </button>
        </div>
      </div>

      <div>
        <p class="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Hệ thống & Tech</p>
        <div class="space-y-1">
          <a href="../version2/kehoach_seo_2026_v2.md" target="_blank" class="w-full nav-btn text-slate-600">
            <i data-lucide="file-text" class="w-5 h-5"></i> Kế hoạch V2 (Cũ)
          </a>
          <button class="w-full nav-btn text-slate-300 cursor-not-allowed">
            <i data-lucide="cpu" class="w-5 h-5"></i> Tech Matrix
          </button>
        </div>
      </div>
    </div>

    <div class="p-6 border-t border-slate-100 space-y-4">
       <div class="bg-slate-50 p-4 rounded-2xl space-y-3">
          <div class="flex items-center gap-3">
             <div class="w-10 h-10 rounded-full border-2 border-white bg-blue-500 shadow-sm flex items-center justify-center text-white text-[10px] font-bold">PL</div>
             <div>
               <p class="text-[12px] font-black text-slate-900 leading-none">Phương Linh</p>
               <p class="text-[9px] text-blue-600 font-bold mt-1 uppercase">SEO Manager</p>
             </div>
          </div>
          <div class="flex items-center gap-3">
             <div class="w-10 h-10 rounded-full border-2 border-white bg-slate-900 shadow-sm flex items-center justify-center text-white text-[10px] font-bold">CK</div>
             <div>
               <p class="text-[12px] font-black text-slate-900 leading-none">Chí Kiệt</p>
               <p class="text-[9px] text-slate-500 font-bold mt-1 uppercase">Tech Lead</p>
             </div>
          </div>
       </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto flex flex-col bg-slate-50/50 relative">
    <header class="h-20 glass px-12 flex items-center justify-between sticky top-0 z-10 border-b border-slate-200/50">
      <div class="flex items-center gap-6">
        <div>
          <h2 id="view-title" class="text-xl font-black text-slate-900 tracking-tight">Tổng Quan Chiến Lược 2026</h2>
          <p id="view-sub" class="text-xs font-medium text-slate-500 mt-0.5">Phân tích chuyên sâu dựa trên mô hình Chuẩn Y Khoa</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 bg-slate-900 text-white px-4 py-2 rounded-xl shadow-lg ring-4 ring-slate-100">
           <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
           <span class="text-[10px] font-black uppercase tracking-widest">Version 3.0 Ready</span>
        </div>
      </div>
    </header>

    <div class="p-12 max-w-7xl mx-auto w-full space-y-12" id="main-container">
      <!-- Content Dynamic -->
    </div>
  </main>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    
    let activeCharts = [];

    window.initDashboard = function() {
      lucide.createIcons();
      switchTab('overview');
    }

    function switchTab(tab) {
      document.querySelectorAll('aside .nav-btn').forEach(b => b.classList.remove('sidebar-item-active'));
      const activeBtn = document.getElementById(`nav-${tab}`);
      if(activeBtn) activeBtn.classList.add('sidebar-item-active');
      
      const container = document.getElementById('main-container');
      const titleEl = document.getElementById('view-title');
      const subEl = document.getElementById('view-sub');
      
      // Clear previous charts to prevent memory leaks
      activeCharts.forEach(c => c.destroy());
      activeCharts = [];

      if (tab === 'overview') {
        titleEl.textContent = 'Bảng Điều Khiển Tổng Quan';
        subEl.textContent = 'Mục tiêu KPIs & Hiệu suất AI Search';
        container.innerHTML = renderOverview();
        initOverviewCharts();
      } else if (tab === 'roadmap') {
        titleEl.textContent = 'Lộ Trình Triển Khai';
        subEl.textContent = 'Kế hoạch Phối hợp SEO & Technical 2026';
        container.innerHTML = renderRoadmap();
        setTimeout(() => {
          mermaid.initialize({ startOnLoad: false, theme: 'neutral', fontFamily: 'Outfit' });
          mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
        }, 100);
      } else {
        const site = DATA_V3[tab];
        titleEl.textContent = site.name;
        subEl.textContent = site.desc;
        container.innerHTML = renderSiteDetails(tab);
        initSiteCharts(tab);
      }
      if(window.lucide) lucide.createIcons();
    }

    function renderOverview() {
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 animate-fade-in">
           <div class="card p-6 space-y-4">
              <div class="flex justify-between items-start">
                 <div class="p-3 bg-blue-50 rounded-2xl"><i data-lucide="trending-up" class="w-6 h-6 text-blue-600"></i></div>
                 <span class="text-[10px] font-black text-green-600 bg-green-50 px-2 py-1 rounded-full">+61% YoY</span>
              </div>
              <div>
                 <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Tổng Traffic Dự Kiến</p>
                 <p class="text-3xl font-black text-slate-900 tracking-tighter">211,300</p>
              </div>
           </div>

           <div class="card p-6 space-y-4">
              <div class="flex justify-between items-start">
                 <div class="p-3 bg-indigo-50 rounded-2xl"><i data-lucide="user-plus" class="w-6 h-6 text-indigo-600"></i></div>
                 <span class="text-[10px] font-black text-indigo-600 bg-indigo-50 px-2 py-1 rounded-full">Target 2026</span>
              </div>
              <div>
                 <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Tổng Lead Mục Tiêu</p>
                 <p class="text-3xl font-black text-slate-900 tracking-tighter">1,191</p>
              </div>
           </div>

           <div class="card p-6 space-y-4 bg-slate-900 border-none shadow-xl ring-1 ring-white/10">
              <div class="flex justify-between items-start">
                 <div class="p-3 bg-white/10 rounded-2xl"><i data-lucide="cpu" class="w-6 h-6 text-amber-400"></i></div>
              </div>
              <div>
                 <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">AI Search Vis%</p>
                 <p class="text-3xl font-black text-white tracking-tighter">25.0%</p>
                 <p class="text-[10px] text-slate-400 mt-1 font-medium italic">Thị phần tiếng nói trên AI</p>
              </div>
           </div>

           <div class="card p-6 space-y-4">
              <div class="flex justify-between items-start">
                 <div class="p-3 bg-rose-50 rounded-2xl"><i data-lucide="zap" class="w-6 h-6 text-rose-600"></i></div>
              </div>
              <div>
                 <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Next.js Migration</p>
                 <p class="text-3xl font-black text-slate-900 tracking-tighter">45%</p>
                 <p class="text-[10px] text-slate-500 mt-1 font-medium">Staging Phase</p>
              </div>
           </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
           <div class="card p-8 space-y-6 shadow-sm">
              <h3 class="text-sm font-black uppercase tracking-widest text-slate-900 flex items-center gap-2">
                 <i data-lucide="bar-chart-3" class="w-4 h-4"></i> So sánh Tăng trưởng Traffic 2026
              </h3>
              <div class="chart-container">
                 <canvas id="overviewTrafficChart"></canvas>
              </div>
           </div>
           
           <div class="card p-8 space-y-6 shadow-sm">
              <h3 class="text-sm font-black uppercase tracking-widest text-slate-900 flex items-center gap-2">
                 <i data-lucide="pie-chart" class="w-4 h-4"></i> Tỷ trọng Lead theo nguồn AI
              </h3>
              <div class="chart-container">
                 <canvas id="overviewAiChart"></canvas>
              </div>
           </div>
        </div>

        <div class="space-y-6">
           <h3 class="text-sm font-black uppercase tracking-widest text-slate-400 pl-4">Thương hiệu Chiến lược</h3>
           <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
              ${Object.keys(DATA_V3).map(key => `
                 <div class="card p-8 hover:ring-2 hover:ring-blue-500/20 group cursor-pointer" onclick="switchTab('${key}')">
                    <div class="flex items-center gap-6">
                       <div class="w-16 h-16 rounded-3xl bg-slate-50 flex items-center justify-center group-hover:bg-blue-600 transition-colors duration-300">
                          <i data-lucide="${key === 'timona' ? 'graduation-cap' : 'stethoscope'}" class="w-8 h-8 text-slate-400 group-hover:text-white"></i>
                       </div>
                       <div class="flex-1">
                          <h4 class="text-xl font-black text-slate-900">${DATA_V3[key].name}</h4>
                          <p class="text-xs font-medium text-slate-500 mt-1 leading-relaxed">${DATA_V3[key].focus}</p>
                       </div>
                       <div class="text-right">
                          <p class="text-lg font-black text-slate-900">${DATA_V3[key].target.traffic}</p>
                          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Sessions</p>
                       </div>
                    </div>
                 </div>
              `).join('')}
           </div>
        </div>
      `;
    }

    function initOverviewCharts() {
      const ctxTraffic = document.getElementById('overviewTrafficChart')?.getContext('2d');
      if(ctxTraffic) {
        activeCharts.push(new Chart(ctxTraffic, {
          type: 'line',
          data: {
            labels: ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'],
            datasets: [
              {
                label: 'Timona Academy',
                data: DATA_V3.timona.kpis.traffic,
                borderColor: '#2563eb',
                tension: 0.4,
                fill: true,
                backgroundColor: 'rgba(37, 99, 235, 0.05)'
              },
              {
                label: 'Taza Skin Clinic',
                data: DATA_V3.clinic.kpis.traffic,
                borderColor: '#db2777',
                tension: 0.4,
                fill: true,
                backgroundColor: 'rgba(219, 39, 119, 0.05)'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } },
            scales: { y: { beginAtZero: false, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } }
          }
        }));
      }

      const ctxAi = document.getElementById('overviewAiChart')?.getContext('2d');
      if(ctxAi) {
        activeCharts.push(new Chart(ctxAi, {
          type: 'doughnut',
          data: {
            labels: ['Lead AI (Timona)', 'Lead Truyền thống (Timona)', 'Lead AI (Taza)', 'Lead Truyền thống (Taza)'],
            datasets: [{
              data: [65, 832-65, 36, 359-36],
              backgroundColor: ['#3b82f6', '#dbeafe', '#f43f5e', '#ffe4e6'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '70%',
            plugins: { legend: { position: 'bottom' } }
          }
        }));
      }
    }

    function renderRoadmap() {
      return `
        <div class="space-y-12 animate-fade-in">
           <div class="card p-10 bg-white shadow-xl ring-1 ring-slate-200">
              <h3 class="text-sm font-black uppercase tracking-widest text-slate-900 mb-8 flex items-center gap-2">
                 <i data-lucide="calendar" class="w-5 h-5 text-blue-600"></i> Giai đoạn 1: Thiết lập & Chuẩn hóa (Q1 2026)
              </h3>
              <div class="mermaid">
gantt
    dateFormat YYYY-MM-DD
    axisFormat %d/%m
    title  Tiến độ Phối hợp SEO & Tech Q1 2026
    
    section Tổng quan
    ${GANTT_V3_DATA.slice(1).map(row => `${row[0]} | ${row[1]} : active, ${row[3]}, ${row[4]}`).join('\n    ')}
              </div>
           </div>

           <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
              <div class="card p-8 bg-blue-600 text-white border-none">
                 <h4 class="text-lg font-black mb-4">Mục tiêu Chiến lược SEO</h4>
                 <ul class="space-y-3 opacity-90">
                    <li class="flex items-start gap-2 text-sm">
                       <i data-lucide="check-circle-2" class="w-4 h-4 mt-0.5 text-blue-200"></i>
                       Xây dựng Thực thể học thuật (Entity) với các Bệnh viện/ĐH Y.
                    </li>
                    <li class="flex items-start gap-2 text-sm">
                       <i data-lucide="check-circle-2" class="w-4 h-4 mt-0.5 text-blue-200"></i>
                       Thống trị AI Search Top 1 cho các câu hỏi về 'Học nghề Spa' & 'Peel da'.
                    </li>
                    <li class="flex items-start gap-2 text-sm">
                       <i data-lucide="check-circle-2" class="w-4 h-4 mt-0.5 text-blue-200"></i>
                       Chuyển đổi hoàn toàn nội dung sang chuẩn Y khoa bảo chứng bởi Bác sĩ.
                    </li>
                 </ul>
              </div>
              <div class="card p-8 bg-slate-900 text-white border-none">
                 <h4 class="text-lg font-black mb-4">Mục tiêu Kỹ thuật (Chí Kiệt)</h4>
                 <ul class="space-y-3 opacity-90">
                    <li class="flex items-start gap-2 text-sm">
                       <i data-lucide="cpu" class="w-4 h-4 mt-0.5 text-slate-400"></i>
                       Hoàn tất Migration WordPress -> Next.js 14 (App Router).
                    </li>
                    <li class="flex items-start gap-2 text-sm">
                       <i data-lucide="cpu" class="w-4 h-4 mt-0.5 text-slate-400"></i>
                       Đạt điểm Core Web Vitals tối đa (LCP < 1.0s, CLS = 0).
                    </li>
                    <li class="flex items-start gap-2 text-sm">
                       <i data-lucide="cpu" class="w-4 h-4 mt-0.5 text-slate-400"></i>
                       Tích hợp CRM thông minh hỗ trợ Lead Scoring tự động.
                    </li>
                 </ul>
              </div>
           </div>
        </div>
      `;
    }

    function renderSiteDetails(key) {
      const site = DATA_V3[key];
      return `
        <div class="space-y-8 animate-fade-in">
           <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div class="card p-6 border-b-4 border-b-blue-600">
                 <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Mục tiêu Traffic</p>
                 <p class="text-2xl font-black text-slate-900 text-center mt-2">${site.target.traffic}</p>
                 <p class="text-[9px] text-green-600 font-bold text-center mt-1">+${site.target.growth} Growth</p>
              </div>
              <div class="card p-6 border-b-4 border-b-indigo-600">
                 <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Mục tiêu Leads</p>
                 <p class="text-2xl font-black text-indigo-600 text-center mt-2">${site.target.leads}</p>
                 <p class="text-[9px] text-indigo-400 font-bold text-center mt-1">Hàng năm</p>
              </div>
              <div class="card p-6 border-b-4 border-b-amber-500 bg-slate-900">
                 <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest text-center">AI Visibility</p>
                 <p class="text-2xl font-black text-amber-500 text-center mt-2">${site.target.aiVis}</p>
                 <p class="text-[9px] text-slate-400 font-bold text-center mt-1">AEO Target</p>
              </div>
              <div class="card p-6 border-b-4 border-b-rose-500">
                 <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">AI Leads</p>
                 <p class="text-2xl font-black text-rose-500 text-center mt-2">${site.target.aiLead}</p>
                 <p class="text-[9px] text-rose-300 font-bold text-center mt-1">Thế hệ mới</p>
              </div>
           </div>

           <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <div class="lg:col-span-2 space-y-8">
                 <h3 class="text-sm font-black uppercase tracking-widest text-slate-400 pl-4">Lộ trình Thực thi Chi tiết</h3>
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${site.tasks.map((t, i) => `
                       <div class="card p-8 space-y-6 relative overflow-hidden group">
                          <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:scale-110 transition-transform">
                             <i data-lucide="zap" class="w-16 h-16"></i>
                          </div>
                          <div class="flex items-center justify-between">
                             <span class="px-3 py-1 bg-slate-100 text-[10px] font-black text-slate-900 rounded-lg uppercase tracking-tighter">${t.week}</span>
                             <span class="text-[10px] font-bold text-slate-300">#0${i+1}</span>
                          </div>
                          <div class="space-y-4">
                             <div>
                                <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 flex items-center gap-2">
                                   <i data-lucide="search" class="w-3 h-3"></i> Chiến lược SEO
                                </p>
                                <p class="text-xs font-bold text-slate-800 leading-relaxed">${t.seo}</p>
                             </div>
                             <div class="pt-4 border-t border-slate-50">
                                <p class="text-[10px] font-black text-rose-600 uppercase tracking-widest mb-2 flex items-center gap-2">
                                   <i data-lucide="code" class="w-3 h-3"></i> Phối hợp Kỹ thuật
                                </p>
                                <p class="text-[11px] font-medium text-slate-600 leading-relaxed">${t.tech}</p>
                             </div>
                          </div>
                       </div>
                    `).join('')}
                 </div>
              </div>

              <div class="space-y-8">
                 <h3 class="text-sm font-black uppercase tracking-widest text-slate-400 pl-4">Thống kê 2026</h3>
                 <div class="card p-8 h-80">
                    <canvas id="siteYearlyChart"></canvas>
                 </div>
                 <div class="card p-8 bg-slate-900 text-white space-y-6 shadow-xl">
                    <h4 class="text-xs font-black uppercase tracking-widest text-amber-400 flex items-center gap-2">
                       <i data-lucide="shield-check" class="w-4 h-4"></i> Bảo chứng E-E-A-T 2026
                    </h4>
                    <div class="space-y-4">
                       <div class="flex items-center gap-4">
                          <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i data-lucide="users" class="w-5 h-5 text-blue-400"></i></div>
                          <div>
                             <p class="text-xs font-bold leading-none">Bác sĩ chuyên khoa</p>
                             <p class="text-[9px] text-slate-400 mt-1 uppercase">Tham vấn & Ký duyệt nội dung</p>
                          </div>
                       </div>
                       <div class="flex items-center gap-4">
                          <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i data-lucide="building-2" class="w-5 h-5 text-green-400"></i></div>
                          <div>
                             <p class="text-xs font-bold leading-none">Đối tác Y học</p>
                             <p class="text-[9px] text-slate-400 mt-1 uppercase">Entity bảo chứng bởi ĐH/Bệnh viện</p>
                          </div>
                       </div>
                       <div class="flex items-center gap-4">
                          <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i data-lucide="award" class="w-5 h-5 text-amber-400"></i></div>
                          <div>
                             <p class="text-xs font-bold leading-none">Trích dẫn Chuyên gia</p>
                             <p class="text-[9px] text-slate-400 mt-1 uppercase">Tăng cường sự tin cậy với AI</p>
                          </div>
                       </div>
                    </div>
                 </div>
              </div>
           </div>
        </div>
      `;
    }

    function initSiteCharts(key) {
      const site = DATA_V3[key];
      const ctx = document.getElementById('siteYearlyChart')?.getContext('2d');
      if(ctx) {
        activeCharts.push(new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'],
            datasets: [
              {
                label: 'Traffic (Analytics)',
                data: site.kpis.traffic,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.1)',
                yAxisID: 'y'
              },
              {
                label: 'Leads',
                data: site.kpis.leads,
                borderColor: '#db2777',
                backgroundColor: 'rgba(219, 39, 119, 0.1)',
                yAxisID: 'y1'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { type: 'linear', position: 'left', grid: { display: false } },
              y1: { type: 'linear', position: 'right', grid: { display: false } }
            },
            plugins: { legend: { position: 'bottom' } }
          }
        }));
      }
    }

    window.switchTab = switchTab;

    document.addEventListener('DOMContentLoaded', () => {
      // If already authed, init
      if (sessionStorage.getItem('seo_auth_v3') === 'true') {
        initDashboard();
      }
    });
  </script>
</body>
</html>
