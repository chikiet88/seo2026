<!DOCTYPE html>
<html lang="vi">
<head>

  <style>
    :root {
      --background: #ffffff;
      --foreground: #020817;
      --card: #ffffff;
      --card-foreground: #020817;
      --primary: #0f172a;
      --primary-foreground: #f8fafc;
      --secondary: #f1f5f9;
      --secondary-foreground: #0f172a;
      --muted: #f1f5f9;
      --muted-foreground: #64748b;
      --border: #e2e8f0;
      --radius: 0.5rem;
    }
    body { font-family: 'Inter', sans-serif; background-color: var(--background); color: var(--foreground); }
    .sidebar-item-active { background-color: var(--secondary); color: var(--secondary-foreground); font-weight: 600; }
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
    .mermaid { width: 100% !important; display: flex; justify-content: center; overflow: hidden; opacity: 0.8;}
    
    /* Force Mermaid Font Sizes */
    .mermaid svg { max-width: 100% !important; height: auto !important; font-family: 'Inter', sans-serif !important; }
    .mermaid text, .mermaid tspan { font-size: 10px !important; font-weight: 500 !important; }
    .mermaid .sectionTitle, .mermaid .section, .mermaid .sectionText { font-size: 11px !important; font-weight: 700 !important; fill: #0f172a !important; }
    .mermaid .taskText, .mermaid .taskTextOutsideRight, .mermaid .taskTextOutsideLeft { font-size: 10px !important; fill: #334155 !important; }
    .mermaid .gridText, .mermaid .tick text { font-size: 9px !important; fill: #94a3b8 !important; }
    
    /* Calendar Styles */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .calendar-day-header { background-color: var(--muted); padding: 8px; text-align: center; font-size: 10px; font-weight: bold; color: var(--muted-foreground); text-transform: uppercase; }
    .calendar-day { background-color: #fff; min-height: 80px; padding: 8px; font-size: 12px; }
    .calendar-day.empty { background-color: #fcfcfc; }
    .calendar-event { margin-top: 4px; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; line-height: 1.2; }
    .event-seo { background-color: #dbeafe; color: #1e40af; border-left: 3px solid #3b82f6; }
    .event-tech { background-color: #fef2f2; color: #991b1b; border-left: 3px solid #ef4444; }
  </style>
</head>
<body class="flex h-screen overflow-hidden">
  <script>
    (function() {
      const PASS = '@SeoTaza*2026';
      if (sessionStorage.getItem('seo_auth_v2') === 'true') return;
      document.body.style.overflow = 'hidden';
      const overlay = document.createElement('div');
      overlay.style = "position:fixed;top:0;left:0;width:100%;height:100%;backdrop-filter:blur(8px);background:rgba(255,255,255,0.8);display:flex;align-items:center;justify-content:center;z-index:9999;";
      overlay.innerHTML = `
        <div class="card p-10 max-w-sm w-full shadow-2xl space-y-6">
          <div class="space-y-2 text-center">
            <h1 class="text-2xl font-semibold tracking-tight">Xác thực hệ thống</h1>
            <p class="text-sm text-slate-500">Nhập mật khẩu để truy cập Dashboard V2.</p>
          </div>
          <div class="space-y-4">
            <input type="password" id="p-v2" placeholder="••••••••" class="w-full border border-slate-200 p-2 rounded-md text-center outline-none focus:border-slate-900 transition-colors">
            <button id="s-v2" class="w-full bg-slate-900 text-white p-2 rounded-md font-medium hover:opacity-90 transition-opacity">Đăng nhập</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const login = () => { if(document.getElementById('p-v2').value === PASS) { sessionStorage.setItem('seo_auth_v2', 'true'); overlay.remove(); document.body.style.overflow = ''; } };
      document.getElementById('s-v2').onclick = login;
      document.getElementById('p-v2').onkeypress = (e) => { if(e.key === 'Enter') login(); };
    })();
  </script>

  <!-- Main Content -->

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ 
      startOnLoad: false, 
      theme: 'neutral',
      fontFamily: 'Inter',
      gantt: { 
        fontSize: 10,
        sectionFontSize: 11,
        leftPadding: 160,
        barHeight: 20,
        barGap: 4,
        topPadding: 30,
        sidePadding: 20,
        gridLineStartPadding: 35,
        useMaxWidth: true
      }
    });

    function switchTab(tab) {
      document.querySelectorAll('aside button').forEach(b => b.classList.remove('sidebar-item-active'));
      document.getElementById(`nav-${tab}`).classList.add('sidebar-item-active');
      
      const container = document.getElementById('main-container');
      const titleEl = document.getElementById('view-title');
      const subEl = document.getElementById('view-sub');
      
      if (tab === 'overview') {
        titleEl.textContent = 'Tổng Quan Chiến Lược';
        subEl.textContent = 'Thống kê mục tiêu & Tăng trưởng';
        container.innerHTML = renderOverview();
      } else if (tab === 'gantt') {
        titleEl.textContent = 'Lộ Trình Triển Khai';
        subEl.textContent = 'Kế hoạch chi tiết Tháng 1-2 2026 (Theo Tuần)';
        container.innerHTML = renderGantt();
        renderCalendar();
        setTimeout(() => {
          mermaid.run({
            nodes: document.querySelectorAll('.mermaid'),
            suppressErrors: true
          });
        }, 100);
      } else {
        const site = DATA_V2[tab];
        titleEl.textContent = site.name;
        subEl.textContent = site.desc;
        container.innerHTML = renderSiteDetails(tab);
      }
      if(window.lucide) lucide.createIcons();
    }

    function renderOverview() {
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <div class="card p-6 space-y-4 shadow-sm">
             <div class="flex items-center justify-between">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-400">Tổng Lead Dự Kiến</h3>

             </div>
             <div class="flex items-end gap-2">
                <p class="text-3xl font-black tracking-tighter">4.335</p>

             </div>
             <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                <div class="bg-blue-600 h-full" style="width: 65%"></div>
             </div>
             <p class="text-[10px] text-slate-500 font-medium">Đã đạt 65% so với tiến độ quý 1</p>
          </div>

          <div class="card p-6 space-y-4 shadow-sm bg-slate-900 border-slate-900">
             <div class="flex items-center justify-between">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-400">Tech Migration</h3>
                <div class="p-2 bg-slate-800 rounded-lg"><i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i></div>
             </div>
             <div class="space-y-1">
                <p class="text-xl font-bold text-white leading-tight">WordPress ➔ Next.js</p>
                <p class="text-[10px] text-slate-400 font-medium">Tối ưu LCP < 1.2s & CLS ~ 0</p>
             </div>
             <div class="flex gap-2 pt-2">
                <span class="px-2 py-1 bg-white/10 rounded text-[9px] font-bold text-white uppercase tracking-tighter">SSR ready</span>

             </div>
          </div>

          <div class="card p-6 space-y-4 shadow-sm">
             <div class="flex items-center justify-between">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-400">SEO Health Index</h3>

             </div>
             <div class="flex items-end gap-2">
                <p class="text-3xl font-black tracking-tighter">92/100</p>

             </div>

          </div>
        </div>

        <div class="space-y-4 pt-4">
           <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 pl-2">Ma trận Thương hiệu 2026</h3>
           <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
             ${Object.keys(DATA_V2).map(key => `
               <div class="card p-6 hover:border-slate-400 transition-all shadow-sm group hover:shadow-md">
                 <div class="flex items-center justify-between">
                    <div class="flex items-center gap-6">
                      <div class="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center group-hover:bg-slate-900 transition-colors">
                        <i data-lucide="${key === 'timona' ? 'graduation-cap' : 'hospital'}" class="w-6 h-6 text-slate-600 group-hover:text-white"></i>
                      </div>
                      <div class="space-y-1">
                        <p class="text-base font-black text-slate-900 tracking-tight">${DATA_V2[key].name}</p>

           </div>
        </div>
      `;
    }

    function renderGantt() {
      const weeks = [
        { label: "Tuần 3 T1 (19-25/01)", seo: "Kiểm tra kỹ thuật & Lỗ hổng nội dung", tech: "Thiết lập cấu trúc Next.js + Shadcn UI" },
        { label: "Tuần 4 T1 (26-31/01)", seo: "Chốt sơ đồ từ khóa Tuyển sinh Q2", tech: "Thiết lập Database & Thiết kế API" },
        { label: "Tuần 1 T2 (01-07/02)", seo: "Xây dựng Thực thể & JSON-LD Khóa học", tech: "Xây dựng thành phần UI Core" },
        { label: "Tuần 2 T2 (08-14/02)", seo: "Thiết lập quy trình nội dung AI", tech: "Cấu trúc Routing & SSG" },
        { label: "Tuần 3 T2 (15-21/02)", seo: "Ma trận liên kết nội bộ", tech: "Tích hợp API Google Search Console" },
        { label: "Tuần 4 T2 (22-28/02)", seo: "Đánh giá Indexing", tech: "Triển khai Staging & Hiệu năng" }
      ];

      return `
        <div class="space-y-12 animate-in fade-in duration-500">
          <div class="flex items-center justify-between border-b pb-4">
             <div class="flex gap-2">
                <button onclick="document.getElementById('timeline-view').classList.remove('hidden'); document.getElementById('gantt-view').classList.add('hidden'); document.getElementById('calendar-view').classList.add('hidden'); this.classList.add('bg-slate-900', 'text-white'); this.nextElementSibling.classList.remove('bg-slate-900', 'text-white'); this.nextElementSibling.nextElementSibling.classList.remove('bg-slate-900', 'text-white');" class="text-[11px] font-bold px-4 py-2 rounded-lg bg-slate-900 text-white shadow-sm transition-all focus:outline-none">Timeline Tuần</button>
                <button onclick="document.getElementById('gantt-view').classList.remove('hidden'); document.getElementById('timeline-view').classList.add('hidden'); document.getElementById('calendar-view').classList.add('hidden'); this.classList.add('bg-slate-900', 'text-white'); this.previousElementSibling.classList.remove('bg-slate-900', 'text-white'); this.nextElementSibling.classList.remove('bg-slate-900', 'text-white');" class="text-[11px] font-bold px-4 py-2 rounded-lg bg-white border text-slate-600 hover:bg-slate-50 transition-all focus:outline-none">Biểu đồ Gantt</button>
                <button onclick="document.getElementById('calendar-view').classList.remove('hidden'); document.getElementById('timeline-view').classList.add('hidden'); document.getElementById('gantt-view').classList.add('hidden'); this.classList.add('bg-slate-900', 'text-white'); this.previousElementSibling.classList.remove('bg-slate-900', 'text-white'); this.previousElementSibling.previousElementSibling.classList.remove('bg-slate-900', 'text-white');" class="text-[11px] font-bold px-4 py-2 rounded-lg bg-white border text-slate-600 hover:bg-slate-50 transition-all focus:outline-none">Lịch Tháng</button>
             </div>
             <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest hidden md:block">Phối hợp Phương Linh & Chí Kiệt</p>
          </div>

          <!-- Timeline View (New UX) -->
          <div id="timeline-view" class="space-y-12 relative pb-10">
            <!-- Thanh nối dọc trung tâm -->
            <div class="absolute left-4 md:left-1/2 top-4 bottom-10 w-px bg-slate-200 -translate-x-1/2"></div>
            
            <div class="space-y-16">
              ${weeks.map((w, i) => `
                <div class="relative group">
                  <div class="flex flex-col md:flex-row items-center gap-8 relative">
                    
                    <!-- Nhãn Tuần (Desktop) -->
                    <div class="w-1/2 text-right hidden md:block pr-12">
                      <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-white z-10 relative px-4">${w.label}</span>
                    </div>

                    <!-- Điểm Marker trung tâm -->
                    <div class="absolute left-4 md:left-1/2 top-0 w-8 h-8 bg-white border-2 border-slate-900 rounded-full -translate-x-1/2 z-10 flex items-center justify-center font-bold text-[10px] text-slate-900 shadow-md group-hover:scale-110 transition-transform">
                      ${i + 1}
                    </div>

                    <!-- Nhãn Tuần (Mobile) -->
                    <div class="pl-12 w-full md:hidden mb-4">
                       <span class="text-[10px] font-black text-slate-900 uppercase tracking-widest bg-slate-100 px-3 py-1 rounded-md">${w.label}</span>
                    </div>

                    <!-- Thẻ công việc -->
                    <div class="w-full md:w-1/2 pl-12 md:pl-12 space-y-4">
                      <div class="grid grid-cols-1 gap-4">
                        <div class="card p-6 border-l-4 border-l-blue-500 shadow-sm hover:shadow-md transition-all group/card relative overflow-hidden">
                          <div class="absolute top-0 right-0 p-2 opacity-10"><i data-lucide="search" class="w-12 h-12"></i></div>
                          <div class="flex items-center gap-2 mb-3">
                            <span class="px-2 py-0.5 rounded text-[8px] font-black uppercase bg-blue-50 text-blue-600">Linh • SEO</span>
                          </div>
                          <p class="text-sm font-semibold text-slate-800 leading-snug">${w.seo}</p>
                        </div>
                        
                        <div class="card p-6 border-l-4 border-l-rose-500 shadow-sm hover:shadow-md transition-all group/card relative overflow-hidden">
                          <div class="absolute top-0 right-0 p-2 opacity-10"><i data-lucide="code" class="w-12 h-12"></i></div>
                          <div class="flex items-center gap-2 mb-3">
                            <span class="px-2 py-0.5 rounded text-[8px] font-black uppercase bg-rose-50 text-rose-600">Kiệt • Tech</span>

                          <p class="text-sm font-semibold text-slate-800 leading-snug">${w.tech}</p>

            <div class="card p-6 overflow-hidden bg-white shadow-sm border-slate-200">
               <div class="mermaid">
gantt
    dateFormat YYYY-MM-DD
    axisFormat %d/%m
    tickInterval 1week
    
    section (SEO) Linh
    Audit Kỹ thuật :2026-01-19, 7d
    Keyword Map Q2 :2026-01-26, 6d
    Schema Entity  :2026-02-01, 7d
    AI Workflow    :2026-02-08, 7d
    Link nội bộ    :2026-02-15, 7d

    section (Tech) Kiệt
    Next.js Setup  :2026-01-19, 7d
    DB/API Design  :2026-01-26, 6d
    UI Core Build  :2026-02-01, 7d
    SSG/Routing    :2026-02-08, 7d
               </div>
            </div>
          </div>

          <!-- Calendar View -->
          <div id="calendar-view" class="hidden space-y-12 animate-in slide-in-from-bottom-4 duration-500">
             <div id="jan-cal"></div>
             <div id="feb-cal"></div>
          </div>
        </div>
      `;
    }

    function renderCalendar() {
      const janCal = document.getElementById('jan-cal');
      const febCal = document.getElementById('feb-cal');
      if(!janCal) return;

      const weekDays = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
      
      const createCal = (monthName, startDayIdx, daysInMonth, events) => {
        let html = `<h4 class="text-sm font-black mb-4 flex items-center gap-2"><i data-lucide="calendar-days" class="w-4 h-4"></i> ${monthName} 2026</h4>`;
        html += `<div class="calendar-grid">`;
        weekDays.forEach(d => html += `<div class="calendar-day-header">${d}</div>`);
        
        let dayCounter = 1;
        for (let i = 0; i < 42; i++) {
          if (i < startDayIdx || dayCounter > daysInMonth) {
            html += `<div class="calendar-day empty"></div>`;
          } else {
            const currentDay = dayCounter;
            const dayEvents = events.filter(e => currentDay >= e.start && currentDay <= e.end);
            html += `<div class="calendar-day"><span class="font-bold">${currentDay}</span>`;
            dayEvents.forEach(e => {
              html += `<div class="calendar-event ${e.type === 'seo' ? 'event-seo' : 'event-tech'}">${e.title}</div>`;
            });
            html += `</div>`;
            dayCounter++;
          }
        }
        html += `</div>`;
        return html;
      };

      const janEvents = [
        { start: 19, end: 25, title: "Linh: Audit Tech", type: "seo" },
        { start: 19, end: 25, title: "Kiệt: Setup NextJS", type: "tech" },
        { start: 26, end: 31, title: "Linh: Keyword Q2", type: "seo" },
        { start: 26, end: 31, title: "Kiệt: DB & API", type: "tech" }
      ];
      janCal.innerHTML = createCal("Tháng 1", 3, 31, janEvents);

      const febEvents = [
        { start: 1, end: 7, title: "Linh: Schema Entity", type: "seo" },
        { start: 1, end: 7, title: "Kiệt: UI Core", type: "tech" },
        { start: 8, end: 14, title: "Linh: AI Workflow", type: "seo" },
        { start: 8, end: 14, title: "Kiệt: Routing/SSG", type: "tech" },
        { start: 15, end: 21, title: "Linh: Link Matrix", type: "seo" },
        { start: 15, end: 21, title: "Kiệt: GSC API", type: "tech" },
        { start: 22, end: 28, title: "Linh: Index Rev", type: "seo" },
        { start: 22, end: 28, title: "Kiệt: Staging/Perf", type: "tech" }
      ];
      febCal.innerHTML = createCal("Tháng 2", 6, 28, febEvents);
      lucide.createIcons();
    }

                <p class="text-2xl font-black text-slate-900 text-center">${site.target.traffic}</p>
             </div>
             <div class="card p-5 border-b-4 border-b-blue-600 shadow-sm">
                <p class="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-1 text-center">Mục tiêu Leads</p>

                <p class="text-2xl font-black text-green-600 text-center">${site.target.growth}</p>
             </div>
          </div>

          <div class="space-y-4">
            <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 pl-2">Lộ trình triển khai chi tiết</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${site.tasks.map((t, i) => `

                      <p class="text-xs font-bold text-slate-800 leading-relaxed">${t.seo}</p>

                      <div class="flex items-center gap-2">

              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    window.switchTab = switchTab;

    document.addEventListener('DOMContentLoaded', () => {
      switchTab('overview');
      if(window.lucide) lucide.createIcons();
    });
  </script>
</body>
