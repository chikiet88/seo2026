<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Dashboard 2026 V2 - Timona & Taza</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="data-v2.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
    .sidebar-item-active { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
    .mermaid { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
  </style>
</head>
<body class="text-slate-900 min-h-screen flex overflow-hidden">
  <!-- Auth Overlay -->
  <script>
    (function() {
      const PASS = '@SeoTaza*2026';
      if (sessionStorage.getItem('seo_auth_v2') === 'true') return;
      document.body.style.overflow = 'hidden';
      const overlay = document.createElement('div');
      overlay.style = "position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:9999;";
      overlay.innerHTML = `
        <div class="bg-white p-12 rounded-[2.5rem] shadow-2xl max-w-md w-full text-center border border-slate-100">
          <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto mb-8 flex items-center justify-center text-white shadow-xl">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <h2 class="text-3xl font-extrabold mb-3 text-slate-900 tracking-tight">Version 2.0</h2>
          <p class="text-slate-500 mb-10 leading-relaxed font-medium">Nhập mật khẩu để truy cập kế hoạch chiến lược Timona & Taza 2026.</p>
          <input type="password" id="p-v2" placeholder="••••••••" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl mb-6 text-center text-xl focus:border-blue-500 outline-none transition-all">
          <button id="s-v2" class="w-full p-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-black transition-all shadow-lg active:scale-[0.98]">Xác nhận</button>
        </div>
      `;
      document.body.appendChild(overlay);
      const login = () => { if(document.getElementById('p-v2').value === PASS) { sessionStorage.setItem('seo_auth_v2', 'true'); overlay.remove(); document.body.style.overflow = ''; } };
      document.getElementById('s-v2').onclick = login;
      document.getElementById('p-v2').onkeypress = (e) => { if(e.key === 'Enter') login(); };
    })();
  </script>

  <!-- Sidebar -->
  <aside class="w-72 border-r border-slate-200 bg-white flex flex-col h-screen sticky top-0 z-20">
    <div class="p-8">
      <div class="flex items-center gap-3 mb-1">
        <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg">V2</div>
        <div>
          <h1 class="font-extrabold text-lg text-slate-900 tracking-tight leading-none">SEO STRATEGY</h1>
          <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Version 2.0 • 2026</p>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-4 space-y-2">
      <div class="px-4 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Main Modules</div>
      <button onclick="switchTab('overview')" id="nav-overview" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 font-bold text-sm transition-all sidebar-item-active">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Tổng Quan V2
      </button>
      <button onclick="switchTab('gantt')" id="nav-gantt" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 font-bold text-sm transition-all hover:bg-slate-50">
        <i data-lucide="calendar" class="w-4 h-4"></i> Timeline/Gantt
      </button>
      
      <div class="mt-8 px-4 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Two Brands</div>
      <button onclick="switchTab('timona')" id="nav-timona" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 font-bold text-sm transition-all hover:bg-slate-50">
        <i data-lucide="graduation-cap" class="w-4 h-4"></i> Timona Academy
      </button>
      <button onclick="switchTab('clinic')" id="nav-clinic" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 font-bold text-sm transition-all hover:bg-slate-50">
        <i data-lucide="hospital" class="w-4 h-4"></i> TazaSkinClinic
      </button>

      <div class="mt-8 px-4 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Resources</div>
      <a href="kehoach_seo_2026_v2.md" target="_blank" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 font-bold text-sm transition-all hover:bg-slate-50">
        <i data-lucide="file-text" class="w-4 h-4"></i> Doc Chi Tiết Plan
      </a>
    </nav>

    <div class="p-6 border-t border-slate-100">
      <div class="bg-slate-50 p-4 rounded-2xl flex items-center gap-3 border border-slate-100">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-black">1+1</div>
        <div>
          <p class="text-xs font-bold text-slate-900">Tinh Gọn Mode</p>
          <p class="text-[10px] text-slate-400 font-medium">1 Tech + 1 SEO</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Content -->
  <main class="flex-1 overflow-y-auto bg-[#f8fafc]">
    <header class="h-20 bg-white/70 backdrop-blur-md border-b border-slate-200 sticky top-0 z-10 px-10 flex items-center justify-between">
      <div>
        <h2 id="view-title" class="text-xl font-extrabold text-slate-900">Tổng Quan Chiến Lược V2</h2>
        <p id="view-sub" class="text-xs text-slate-400 font-bold uppercase tracking-wider">Tập trung nguồn lực 2 Brand & Tech Migration</p>
      </div>
      <div class="flex items-center gap-6">
        <div class="flex flex-col items-end">
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Project Lead</span>
          <span class="text-sm font-black text-blue-600">Next.js Migration</span>
        </div>
        <div class="h-8 w-px bg-slate-200"></div>
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-slate-200 to-slate-300"></div>
      </div>
    </header>

    <div class="p-10 max-w-7xl mx-auto space-y-10" id="main-container">
      <!-- Tabs content will be injected here -->
    </div>
  </main>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('sidebar-item-active', 'bg-slate-50'));
      document.getElementById(`nav-${tab}`).classList.add('sidebar-item-active');
      
      const container = document.getElementById('main-container');
      const titleEl = document.getElementById('view-title');
      
      if (tab === 'overview') {
        titleEl.textContent = 'Tổng Quan Chiến Lược V2';
        container.innerHTML = renderOverview();
      } else if (tab === 'gantt') {
        titleEl.textContent = 'Lộ Trình Triển Khai';
        container.innerHTML = renderGantt();
        setTimeout(() => mermaid.init(), 100);
      } else {
        const site = DATA_V2[tab];
        titleEl.textContent = site.name;
        container.innerHTML = renderSiteDetails(tab);
      }
      lucide.createIcons();
    }

    function renderOverview() {
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="bg-gradient-to-br from-blue-700 to-indigo-800 p-8 rounded-[2rem] text-white shadow-xl relative overflow-hidden group">
            <div data-lucide="cpu" class="absolute -right-10 -bottom-10 w-48 h-48 opacity-10 group-hover:rotate-12 transition-transform duration-500"></div>
            <h3 class="text-2xl font-black mb-4">Mô Hình Nhân Sự Tinh Gọn</h3>
            <div class="space-y-4">
              <div class="flex items-center gap-4 bg-white/10 p-4 rounded-2xl border border-white/10">
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center font-black">01</div>
                <div><p class="font-bold text-lg">SEO Manager</p><p class="text-xs text-white/70">Plan & Content 2 Brand</p></div>
              </div>
              <div class="flex items-center gap-4 bg-white/10 p-4 rounded-2xl border border-white/10">
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center font-black">01</div>
                <div><p class="font-bold text-lg">Tech Full-stack</p><p class="text-xs text-white/70">WP -> Next.js Migration</p></div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            ${Object.keys(DATA_V2).map(key => `
              <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-md transition-all">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">${DATA_V2[key].name}</p>
                <p class="text-3xl font-black text-slate-900">${DATA_V2[key].target.leads}</p>
                <p class="text-[10px] text-green-600 font-bold mt-1">Target Lead/Năm</p>
                <div class="mt-4 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full bg-blue-500 w-${key === 'timona' ? '2/3' : '1/2'}"></div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="bg-white p-10 rounded-[2rem] border border-slate-100 shadow-sm">
          <h3 class="text-xl font-bold text-slate-900 mb-8 flex items-center gap-3">
            <i data-lucide="target" class="text-blue-600"></i> Mục Tiêu Hai Thương Hiệu Trọng Tâm
          </h3>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead>
                <tr class="text-left text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] border-b border-slate-50">
                  <th class="pb-6">Brand</th>
                  <th class="pb-6">Trọng Tâm</th>
                  <th class="pb-6">Traffic Target</th>
                  <th class="pb-6">Growth</th>
                </tr>
              </thead>
              <tbody class="text-sm font-semibold">
                ${Object.keys(DATA_V2).map(key => `
                  <tr class="hover:bg-slate-50/50 transition-colors">
                    <td class="py-6 flex items-center gap-4">
                      <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white">
                        <i data-lucide="${key === 'timona' ? 'graduation-cap' : 'hospital'}" class="w-5 h-5"></i>
                      </div>
                      ${DATA_V2[key].name}
                    </td>
                    <td class="py-6 text-slate-500">${DATA_V2[key].focus}</td>
                    <td class="py-6 text-slate-900 font-bold">${DATA_V2[key].target.traffic}</td>
                    <td class="py-6 text-green-600 font-black">${DATA_V2[key].target.growth}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderGantt() {
      return `
        <div class="space-y-8">
          <div class="bg-indigo-900 p-8 rounded-[2rem] text-white">
            <h3 class="text-xl font-bold mb-2">Roadmap Chuyển Đổi Next.js + SEO Plan</h3>
            <p class="text-indigo-200 text-sm">Sự phối hợp giữa Tech (Build nền tảng) và SEO (Đổ nội dung & Traffic)</p>
          </div>
          <div class="mermaid">
            gantt
              title Lộ Trình SEO & Tech 2026
              dateFormat YYYY-MM-DD
              axisFormat %m/%Y

              section SEO Manager
              Audit & Research        :2026-01-01, 30d
              Entity & Schema Map     :2026-02-01, 30d
              Content Timona Q2       :2026-03-01, 120d
              Content Taza Q3         :2026-07-01, 90d
              AI Citation Opt         :active, 2026-01-01, 365d

              section Tech Project
              Arch Design (V2)        :2026-01-01, 45d
              Next.js Dev (Timona)    :2026-02-15, 90d
              Data Migration          :2026-05-15, 45d
              Next.js Dev (Taza)      :2026-07-01, 90d
              Go-live & Performance   :2026-10-01, 92d
          </div>
          
          <div class="bg-white p-8 rounded-[2rem] border border-slate-100">
             <h4 class="font-bold text-slate-900 mb-6">Bảng Phân Công Hạng Mục Chi Tiết</h4>
             <table class="w-full text-sm">
                <thead>
                  <tr class="text-left font-bold text-slate-400 border-b">
                    <th class="pb-4 px-4">Nhân Sự</th>
                    <th class="pb-4 px-4">Hạng Mục</th>
                    <th class="pb-4 px-4 text-center">Thời Gian</th>
                    <th class="pb-4 px-4 text-right">Trạng Thái</th>
                  </tr>
                </thead>
                <tbody class="font-medium">
                  ${GANTT_V2_DATA.slice(1).map(row => `
                    <tr class="border-b border-slate-50 last:border-0 hover:bg-slate-50 transition-colors">
                      <td class="py-4 px-4 font-bold text-slate-800">${row[0]}</td>
                      <td class="py-4 px-4 text-slate-600">${row[1]}</td>
                      <td class="py-4 px-4 text-center text-xs text-slate-400">${row[2]} - ${row[3]}</td>
                      <td class="py-4 px-4 text-right">
                        <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${row[4] === 'Done' ? 'bg-green-100 text-green-700' : row[4] === 'In Progress' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-500'}">${row[4]}</span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
             </table>
          </div>
        </div>
      `;
    }

    function renderSiteDetails(key) {
      const site = DATA_V2[key];
      return `
        <div class="space-y-10">
          <div class="flex items-center gap-6">
            <div class="w-16 h-16 bg-slate-900 rounded-3xl flex items-center justify-center text-white shadow-xl">
              <i data-lucide="${key === 'timona' ? 'graduation-cap' : 'hospital'}" class="w-8 h-8"></i>
            </div>
            <div>
              <h2 class="text-3xl font-black text-slate-900 tracking-tight">${site.name}</h2>
              <p class="text-slate-500 font-medium">${site.desc}</p>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-8 rounded-[2rem] border border-slate-100 text-center">
              <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Target Traffic</p>
              <p class="text-4xl font-black text-slate-900">${site.target.traffic}</p>
            </div>
            <div class="bg-white p-8 rounded-[2rem] border border-slate-100 text-center">
              <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Target Leads</p>
              <p class="text-4xl font-black text-blue-600">${site.target.leads}</p>
            </div>
            <div class="bg-white p-8 rounded-[2rem] border border-slate-100 text-center">
              <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Growth KPI</p>
              <p class="text-4xl font-black text-green-600">${site.target.growth}</p>
            </div>
          </div>

          <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
            <h3 class="font-bold text-slate-900 mb-8 flex items-center gap-3">
               <i data-lucide="list-checks" class="text-blue-600"></i> Lộ Trình Phối Hợp SEO & Tech
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
               ${site.tasks.map((t, i) => `
                 <div class="p-6 bg-slate-50 rounded-2xl relative overflow-hidden group">
                    <div class="absolute -right-2 -top-2 text-6xl font-black text-slate-100 group-hover:text-blue-50 transition-colors">${i+1}</div>
                    <p class="text-xs font-black text-blue-600 mb-4 z-10 relative">${t.month}</p>
                    <div class="space-y-4 z-10 relative">
                       <div>
                          <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">SEO Task</p>
                          <p class="text-sm font-bold text-slate-800 leading-tight">${t.seo}</p>
                       </div>
                       <div class="pt-4 border-t border-slate-200">
                          <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Tech Task</p>
                          <p class="text-sm font-bold text-indigo-600 leading-tight">${t.tech}</p>
                       </div>
                    </div>
                 </div>
               `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      switchTab('overview');
      lucide.createIcons();
    });
  </script>
</body>
</html>
