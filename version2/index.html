<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Dashboard 2026 V2 - Shadcn Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="data-v2.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #ffffff;
      --foreground: #020817;
      --card: #ffffff;
      --card-foreground: #020817;
      --popover: #ffffff;
      --popover-foreground: #020817;
      --primary: #0f172a;
      --primary-foreground: #f8fafc;
      --secondary: #f1f5f9;
      --secondary-foreground: #0f172a;
      --muted: #f1f5f9;
      --muted-foreground: #64748b;
      --accent: #f1f5f9;
      --accent-foreground: #020817;
      --border: #e2e8f0;
      --input: #e2e8f0;
      --ring: #020817;
      --radius: 0.5rem;
    }
    body { font-family: 'Inter', sans-serif; background-color: var(--background); color: var(--foreground); }
    .sidebar-item-active { background-color: var(--secondary); color: var(--secondary-foreground); font-weight: 600; }
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
    .mermaid { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 100%; display: flex; justify-content: center; }
    /* Shadcn Overlay Style */
    #auth-overlay { backdrop-filter: blur(8px); background: rgba(255, 255, 255, 0.8); }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: 500; transition: opacity 0.2s; }
    .btn-primary:active { opacity: 0.8; }
    .input-shadcn { border: 1px solid var(--input); padding: 0.5rem 0.75rem; border-radius: 0.375rem; outline: none; transition: border-color 0.2s; }
    .input-shadcn:focus { border-color: var(--ring); }
  </style>
</head>
<body class="flex h-screen overflow-hidden">
  <script>
    (function() {
      const PASS = '@SeoTaza*2026';
      if (sessionStorage.getItem('seo_auth_v2') === 'true') return;
      document.body.style.overflow = 'hidden';
      const overlay = document.createElement('div');
      overlay.id = 'auth-overlay';
      overlay.style = "position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:9999;";
      overlay.innerHTML = `
        <div class="card p-10 max-w-sm w-full shadow-2xl space-y-6">
          <div class="space-y-2">
            <h1 class="text-2xl font-semibold tracking-tight">Xác thực hệ thống</h1>
            <p class="text-sm text-slate-500">Nhập mật khẩu để truy cập Dashboard V2.</p>
          </div>
          <div class="space-y-4">
            <div class="space-y-1">
              <input type="password" id="p-v2" placeholder="••••••••" class="input-shadcn w-full text-center">
            </div>
            <button id="s-v2" class="btn-primary w-full">Đăng nhập</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const login = () => { if(document.getElementById('p-v2').value === PASS) { sessionStorage.setItem('seo_auth_v2', 'true'); overlay.remove(); document.body.style.overflow = ''; } };
      document.getElementById('s-v2').onclick = login;
      document.getElementById('p-v2').onkeypress = (e) => { if(e.key === 'Enter') login(); };
    })();
  </script>

  <!-- Sidebar -->
  <aside class="w-64 border-r border-slate-200 bg-slate-50/40 flex flex-col">
    <div class="p-6 border-b border-slate-200">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 bg-slate-900 rounded flex items-center justify-center text-white text-[10px] font-bold">V2</div>
        <span class="font-semibold tracking-tight text-sm">SEO Dashboard</span>
      </div>
    </div>
    
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      <div class="space-y-1">
        <p class="px-2 text-[10px] font-medium text-slate-500 uppercase tracking-widest mb-1">Main</p>
        <button onclick="switchTab('overview')" id="nav-overview" class="w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-100 sidebar-item-active">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Tổng Quan
        </button>
        <button onclick="switchTab('gantt')" id="nav-gantt" class="w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-100">
          <i data-lucide="calendar" class="w-4 h-4"></i> Timeline / Gantt
        </button>
      </div>

      <div class="space-y-1">
        <p class="px-2 text-[10px] font-medium text-slate-500 uppercase tracking-widest mb-1">Brands</p>
        <button onclick="switchTab('timona')" id="nav-timona" class="w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-100">
          <i data-lucide="graduation-cap" class="w-4 h-4"></i> Timona Academy
        </button>
        <button onclick="switchTab('clinic')" id="nav-clinic" class="w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors text-slate-600 hover:text-slate-900 hover:bg-slate-100">
          <i data-lucide="hospital" class="w-4 h-4"></i> TazaSkinClinic
        </button>
      </div>
    </div>

    <div class="p-4 border-t border-slate-200">
       <div class="flex items-center gap-3 px-2">
          <div class="w-8 h-8 rounded-full bg-slate-200 border border-slate-300"></div>
          <div>
            <p class="text-xs font-semibold">SEO Manager</p>
            <p class="text-[10px] text-slate-500">TazaGroup Agent</p>
          </div>
       </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto flex flex-col bg-white">
    <header class="h-14 border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 bg-white/80 backdrop-blur-sm z-10">
      <div class="flex items-center gap-4">
        <h2 id="view-title" class="text-sm font-semibold text-slate-900">Tổng Quan Chiến Lược</h2>
        <div class="w-px h-4 bg-slate-200"></div>
        <p id="view-sub" class="text-xs text-slate-500">Hệ sinh thái Timona & Taza 2026</p>
      </div>
      <div class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded uppercase">V2.1 - FEB 2026 FOCUS</div>
    </header>

    <div class="p-8 max-w-6xl mx-auto w-full space-y-10" id="main-container">
      <!-- Content -->
    </div>
  </main>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

    function switchTab(tab) {
      document.querySelectorAll('aside button').forEach(b => b.classList.remove('sidebar-item-active'));
      document.getElementById(`nav-${tab}`).classList.add('sidebar-item-active');
      
      const container = document.getElementById('main-container');
      const titleEl = document.getElementById('view-title');
      const subEl = document.getElementById('view-sub');
      
      if (tab === 'overview') {
        titleEl.textContent = 'Tổng Quan Chiến Lược';
        subEl.textContent = 'Thống kê mục tiêu & Tăng trưởng';
        container.innerHTML = renderOverview();
      } else if (tab === 'gantt') {
        titleEl.textContent = 'Lộ Trình Triển Khai';
        subEl.textContent = 'Chi tiết kế hoạch Jan-Feb 2026 (Hàng Tuần)';
        container.innerHTML = renderGantt();
        // Use a small delay to ensure DOM is ready for mermaid
        setTimeout(() => {
          const els = document.querySelectorAll('.mermaid-target');
          els.forEach((el, i) => {
            const id = `mermaid-graph-${i}`;
            const graphDefinition = el.textContent;
            mermaid.render(id, graphDefinition).then(({ svg }) => {
              el.innerHTML = svg;
            });
          });
        }, 100);
      } else {
        const site = DATA_V2[tab];
        titleEl.textContent = site.name;
        subEl.textContent = site.desc;
        container.innerHTML = renderSiteDetails(tab);
      }
      lucide.createIcons();
    }

    function renderOverview() {
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="card p-6 space-y-4">
             <div class="flex items-center justify-between">
                <h3 class="text-sm font-semibold">Mục tiêu Lead Toàn Năm</h3>
                <i data-lucide="trending-up" class="w-4 h-4 text-slate-400"></i>
             </div>
             <div class="flex items-end gap-2">
                <p class="text-3xl font-bold tracking-tighter">4.335</p>
                <p class="text-xs text-green-600 font-bold bg-green-50 px-1.5 py-0.5 rounded mb-1">+55%</p>
             </div>
             <p class="text-xs text-slate-500">Lead dự kiến từ Timona (3.660) & Taza (675)</p>
          </div>
          <div class="card p-6 space-y-4 bg-slate-900 text-white border-slate-900">
             <div class="flex items-center justify-between">
                <h3 class="text-sm font-semibold opacity-90">Tech Stack Migration</h3>
                <i data-lucide="cpu" class="w-4 h-4 opacity-50"></i>
             </div>
             <div class="space-y-1">
                <p class="text-2xl font-bold tracking-tight">WordPress → Next.js</p>
                <p class="text-xs opacity-70">Focus: Performance, SSR & AI-First SEO</p>
             </div>
          </div>
        </div>

        <div class="space-y-6">
          <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400">Brand Matrix</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${Object.keys(DATA_V2).map(key => `
              <div class="card p-6 flex items-start gap-4">
                <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center shrink-0">
                  <i data-lucide="${key === 'timona' ? 'graduation-cap' : 'hospital'}" class="w-5 h-5 text-slate-700"></i>
                </div>
                <div class="space-y-2">
                  <p class="text-sm font-bold">${DATA_V2[key].name}</p>
                  <p class="text-xs text-slate-500 leading-relaxed">${DATA_V2[key].focus}</p>
                  <div class="flex gap-4 pt-2">
                    <div>
                      <p class="text-[10px] text-slate-400 uppercase font-bold">Traffic</p>
                      <p class="text-xs font-bold">${DATA_V2[key].target.traffic}</p>
                    </div>
                    <div>
                      <p class="text-[10px] text-slate-400 uppercase font-bold">Leads</p>
                      <p class="text-xs font-bold">${DATA_V2[key].target.leads}</p>
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderGantt() {
      return `
        <div class="space-y-10">
          <div class="space-y-4">
             <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-blue-600 rounded-full"></div>
                <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400">Weekly Roadmap (Jan-Feb 2026)</h3>
             </div>
             <div class="mermaid-target">
gantt
    title Kế Hoạch Weekly Jan-Feb 2026
    dateFormat YYYY-MM-DD
    axisFormat %d/%m
    
    section SEO Manager
    Audit Tech (Jan W3)        :2026-01-19, 7d
    Keyword Map Q2 (Jan W4)    :2026-01-26, 6d
    Entity Schema (Feb W1)     :2026-02-01, 7d
    AI Workflow (Feb W2)       :2026-02-08, 7d
    Internal Link Matrix (Feb W3):2026-02-15, 7d
    Indexing Review (Feb W4)   :2026-02-22, 7d

    section Tech Migration
    Setup Next.js (Jan W3)     :2026-01-19, 7d
    DB Design (Jan W4)         :2026-01-26, 6d
    UI Components (Feb W1)     :2026-02-01, 7d
    Routing Setup (Feb W2)     :2026-02-08, 7d
    GSC Integration (Feb W3)   :2026-02-15, 7d
    Staging & Audit (Feb W4)   :2026-02-22, 7d
             </div>
          </div>

          <div class="space-y-4">
             <h3 class="text-sm font-bold text-slate-900 border-b pb-2">Bảng công tác chi tiết</h3>
             <div class="overflow-x-auto">
                <table class="w-full text-xs">
                  <thead>
                    <tr class="text-left font-bold text-slate-400 uppercase tracking-wider">
                      <th class="py-3 px-4">Nhân sự</th>
                      <th class="py-3 px-4">Công việc chi tiết</th>
                      <th class="py-3 px-4">Thời gian</th>
                      <th class="py-3 px-4 text-right">Tình trạng</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${GANTT_V2_DATA.slice(1).map(row => `
                      <tr class="hover:bg-slate-50 transition-colors">
                        <td class="py-4 px-4 font-bold text-slate-900">${row[0]}</td>
                        <td class="py-4 px-4 text-slate-600">${row[1]}</td>
                        <td class="py-4 px-4 text-slate-400 font-medium">${row[2]} → ${row[3]}</td>
                        <td class="py-4 px-4 text-right">
                          <span class="px-2 py-0.5 rounded-full font-bold uppercase text-[9px] ${row[4] === 'In Progress' ? 'bg-blue-50 text-blue-600' : 'bg-slate-50 text-slate-400'}">${row[4]}</span>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
             </div>
          </div>
        </div>
      `;
    }

    function renderSiteDetails(key) {
      const site = DATA_V2[key];
      return `
        <div class="space-y-10">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${site.tasks.map((t, i) => `
              <div class="card p-6 space-y-4 border-l-4 border-l-slate-900 hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between">
                  <span class="text-[10px] font-black text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">${t.week}</span>
                </div>
                <div class="space-y-3">
                  <div class="space-y-1">
                    <p class="text-[10px] uppercase font-bold text-blue-600">SEO Strategy</p>
                    <p class="text-sm font-bold text-slate-800">${t.seo}</p>
                  </div>
                  <div class="pt-3 border-t border-slate-50 space-y-1">
                    <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Tech Sync</p>
                    <p class="text-sm font-medium text-slate-600">${t.tech}</p>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Export switchTab to global
    window.switchTab = switchTab;

    // Bootstrap
    document.addEventListener('DOMContentLoaded', () => {
      switchTab('overview');
      lucide.createIcons();
    });
  </script>
</body>
</html>
