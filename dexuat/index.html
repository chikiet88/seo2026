<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đề xuất Chiến lược SEO & AI 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-item-active {
            background-color: #f4f4f5;
            color: #18181b;
            font-weight: 600;
        }
        .sidebar-item {
            transition: all 0.2s;
        }
        .sidebar-item:hover {
            background-color: #f4f4f5;
        }
    </style>
</head>
<body class="bg-[#fafafa]">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-72 border-r border-slate-200 bg-white flex flex-col fixed h-full shadow-sm">
            <div class="p-6 border-b border-slate-100">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-8 h-8 bg-zinc-900 rounded-lg flex items-center justify-center">
                        <i data-lucide="lightbulb" class="w-5 h-5 text-white"></i>
                    </div>
                    <span class="font-bold text-sm tracking-tight text-zinc-900">ĐỀ XUẤT CHIẾN LƯỢC</span>
                </div>
                <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">TazaGroup 2026</p>
            </div>

            <nav class="flex-1 p-4 space-y-8 overflow-y-auto">
                <div>
                    <p class="px-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Các đề xuất</p>
                    <div id="proposal-list" class="space-y-1">
                        <!-- JS handles proposals -->
                    </div>
                </div>

                <div>
                    <p class="px-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Hệ thống</p>
                    <div class="space-y-1">
                        <a href="../index.html" class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-600 rounded-md sidebar-item">
                            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                            Quay lại Dashboard
                        </a>
                        <a href="../baocao/index.html" class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-600 rounded-md sidebar-item">
                            <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                            Báo cáo KPI
                        </a>
                        <a href="../cuochop/index.html" class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-slate-600 rounded-md sidebar-item">
                            <i data-lucide="users" class="w-4 h-4"></i>
                            Cuộc Họp (Reviews)
                        </a>
                    </div>
                </div>
            </nav>

            <div class="p-4 border-t border-slate-100 bg-slate-50/50">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-zinc-900 flex items-center justify-center text-[10px] text-white font-bold">CK</div>
                    <div>
                        <p class="text-[11px] font-bold text-slate-900">Chí Kiệt</p>
                        <p class="text-[9px] text-slate-500 font-medium tracking-tight">Technical Manager</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-72 p-8">
            <div class="max-w-6xl mx-auto">
                <header class="mb-8 flex items-center justify-between animate-fade-in">
                    <div>
                        <h1 id="proposal-header" class="text-2xl font-extrabold text-zinc-900 tracking-tight">Đề xuất Tối ưu</h1>
                        <p class="text-sm text-slate-500 mt-1">Nội dung chi tiết các đề xuất tối ưu kỹ thuật và hạ tầng.</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="refreshReport()" class="h-9 px-4 rounded-md border border-slate-200 bg-white text-xs font-semibold text-slate-900 hover:bg-slate-50 transition-colors flex items-center gap-2">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Làm mới
                        </button>
                        <button onclick="window.open(document.getElementById('report-frame').src, '_blank')" class="h-9 px-4 rounded-md bg-zinc-900 text-xs font-semibold text-white hover:bg-zinc-800 transition-colors flex items-center gap-2 shadow-sm">
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Mở cửa sổ mới
                        </button>
                    </div>
                </header>

                <!-- Report Container -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden min-h-[800px] flex flex-col">
                    <iframe id="report-frame" src="" class="w-full flex-1 border-none" style="min-height: 800px;"></iframe>
                </div>
            </div>
        </main>
    </div>

    <script>
        const proposals = [
            { id: 1, name: "Tối ưu 5 website (Focus)", file: "he_thong_website_2026.html", active: true },
            // Thêm đề xuất mới tại đây: { id: 2, name: "Đề xuất ABCD", file: "file_moi.html", active: true },
        ];

        let currentProposal = 1;

        function loadProposals() {
            const list = document.getElementById('proposal-list');
            list.innerHTML = proposals.map(p => `
                <button onclick="${p.active ? `selectProposal(${p.id})` : ''}" 
                        class="w-full flex items-center justify-between gap-3 px-3 py-2 text-xs font-medium rounded-md sidebar-item ${currentProposal === p.id ? 'sidebar-item-active' : 'text-slate-500'} ${!p.active ? 'opacity-40 cursor-not-allowed' : ''}">
                    <div class="flex items-center gap-3">
                        <i data-lucide="file-check" class="w-4 h-4"></i>
                        ${p.name}
                    </div>
                    ${p.active ? '<div class="w-1.5 h-1.5 rounded-full bg-blue-500"></div>' : ''}
                </button>
            `).join('');
            lucide.createIcons();
        }

        function selectProposal(id) {
            currentProposal = id;
            const proposal = proposals.find(p => p.id === id);
            document.getElementById('report-frame').src = proposal.file;
            document.getElementById('proposal-header').innerText = proposal.name;
            loadProposals();
        }

        function refreshReport() {
            const frame = document.getElementById('report-frame');
            frame.src = frame.src;
        }

        window.onload = () => {
            loadProposals();
            if (proposals.length > 0) {
                selectProposal(proposals[0].id);
            }
            lucide.createIcons();
        };
    </script>
</body>
</html>
